    <template id="s1-template">
      <style>
        /*@CSS*/
        #s1-root .map path { stroke-linejoin: round; }
        #s1-root .overlay { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
        #s1-root .place { position: absolute; left: 0; top: 0; width: 470px; opacity: 0; padding: 12px 16px 14px; will-change: transform, opacity; }
        #s1-root .place.right { text-align: left; width: 560px; }
        #s1-root .place.left { text-align: right; }
        #s1-root .place h3 { margin: 0; font: 500 38px/1.08 Literata, serif; letter-spacing: -0.02em; color: #293F3D; }
        #s1-root .place .state { margin-top: 8px; font: 600 29px/1.2 'Source Sans 3', sans-serif; color: #A64F32; }
        #s1-root .place .src { margin-top: 6px; font: 400 24px/1.25 'Source Sans 3', sans-serif; color: #53645D; }
        #s1-root .sea-name { position: absolute; left: 0; top: 0; font: italic 500 32px Literata, serif; color: #367B86; opacity: 0; white-space: nowrap; }
        #s1-root .energy { position: absolute; left: 0; top: 0; width: 760px; opacity: 0; will-change: transform, opacity; }
        #s1-root .energy .big { font: 500 112px/0.95 Literata, serif; letter-spacing: -0.03em; color: #A64F32; }
        #s1-root .energy .big span { font: 600 40px 'Source Sans 3', sans-serif; letter-spacing: 0; margin-left: 10px; color: #293F3D; }
        #s1-root .energy .what { margin-top: 10px; font: 600 30px/1.2 'Source Sans 3', sans-serif; color: #293F3D; }
        #s1-root .energy .src { margin-top: 6px; font: 400 24px/1.25 'Source Sans 3', sans-serif; color: #53645D; }
        #s1-root .coast { position: absolute; left: 0; top: 0; overflow: visible; opacity: 0; transform-origin: 900px 520px; }
        #s1-root .ctag { position: absolute; opacity: 0; font: 600 30px/1.2 'Source Sans 3', sans-serif; color: #293F3D; white-space: nowrap; will-change: transform, opacity; }
        #s1-root .ctag small { display: block; font: 400 24px/1.25 'Source Sans 3', sans-serif; color: #53645D; }
        #s1-root .ctag.big { font: 500 72px/1 Literata, serif; color: #293F3D; letter-spacing: -0.02em; }
        #s1-root .ctag.big span { font: 600 32px 'Source Sans 3', sans-serif; margin-left: 10px; letter-spacing: 0; }
        #s1-root .need { position: absolute; left: 96px; opacity: 0; display: flex; align-items: center; gap: 18px; font: 600 40px/1.15 'Source Sans 3', sans-serif; color: #293F3D; white-space: nowrap; will-change: transform, opacity; }
        #s1-root .need svg { flex: none; }
        #s1-root .need.water b { color: #286B75; }
        #s1-root .need.power b { color: #A64F32; }
        #s1-root .ask .wd.en { color: #A64F32; }
        #s1-root .ask { position: absolute; left: 0; right: 0; top: 700px; text-align: center; font: 500 70px/1.16 Literata, serif; letter-spacing: -0.02em; color: #293F3D; }
        #s1-root .ask .wd { display: inline-block; opacity: 0; margin: 0 0.12em; will-change: transform, opacity; }
        #s1-root .ask .wd.hl { color: #286B75; }
        #s1-root .title { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; transform-origin: 960px 560px; }
        #s1-root .title text { font: 500 150px Literata, serif; letter-spacing: -0.03em; fill: #293F3D; fill-opacity: 0; stroke: #293F3D; stroke-width: 1.4; stroke-dasharray: 1400 1400; stroke-dashoffset: 1400; }
      </style>

      <div data-hf-id="hf-bsci" id="s1-root" data-composition-id="s1" data-width="1920" data-height="1080" data-duration="{{SCENE_DUR}}">
        <div data-hf-id="hf-12x1" class="cam">
          <div data-hf-id="hf-oy59" class="world" data-layout-allow-overflow="">
            <svg data-hf-id="hf-j0sq" class="dg map" viewBox="0 0 1920 1080" width="1920" height="1080">
              <g data-hf-id="hf-nk76" class="nb" />
              <g data-hf-id="hf-faq0" class="indo" />
              <g data-hf-id="hf-neog" class="bali" opacity="0" />
              <g data-hf-id="hf-gjr1" class="swell" />
            </svg>
          </div>
          <svg data-hf-id="hf-15bw" class="overlay" viewBox="0 0 1920 1080" width="1920" height="1080" data-layout-allow-overflow="">

            <g data-hf-id="hf-aox0" class="marks" />
          </svg>

            <h3 data-hf-id="hf-gxgj">Kuta Utara, Badung</h3>
            <div data-hf-id="hf-tzrf" class="state">Air tanah pesisir terintrusi air laut</div>

            <div data-hf-id="hf-ymyj" class="state">Belum teraliri air bersih</div>
            <div data-hf-id="hf-8xnf" class="src">detikBali, 12 Mei 2026</div>
          </div>

          <div class="energy">
            <div class="big">63<span>GW</span></div>
            <div class="what">potensi praktis energi laut Indonesia, belum dimanfaatkan optimal</div>
            <div class="src">arus, gelombang &amp; panas laut · Badan Geologi, Kementerian ESDM</div>

        <svg class="coast" viewBox="0 0 1920 1080" width="1920" height="1080" data-layout-allow-overflow="">
          <path class="c-sea" fill="#367B86" fill-opacity="0.85" />
          <path class="c-crest" fill="none" stroke="#2F6670" stroke-width="3.5" stroke-linejoin="round" />
          <path d="M560 500 L1930 500 L1930 1090 L-10 1090 L-10 985 L560 790Z" fill="#DED4BD" />
          <path d="M560 790 L560 500 L1930 500" fill="none" stroke="#293F3D" stroke-width="3" />
          <path d="M-10 985 L560 790" fill="none" stroke="#293F3D" stroke-opacity="0.75" stroke-width="2.5" />
          <path class="c-walk" d="M600 548 H1900" fill="none" stroke="#B9AD92" stroke-width="10" stroke-linecap="round" />
          <g class="c-build" />
          <g class="c-people" />
          <g class="c-lamps" />
          <rect class="c-night" x="-20" y="-20" width="1960" height="1120" fill="#1E3446" opacity="0" />
          <g class="c-cones" opacity="0" />
        </svg>
        <div class="ctag" data-k="toilet" style="left:650px;top:300px">Toilet &amp; bilas</div>
        <div class="ctag" data-k="kios" style="left:1080px;top:340px">5 kios</div>
        <div class="ctag" data-k="lampu" style="left:1560px;top:296px">8 lampu jalur</div>
        <div class="ctag big" data-k="visit" style="left:930px;top:600px">200<span>pengunjung / hari</span><small>1 ikon = 20 orang</small></div>
        <div class="need water" style="top:150px"><svg width="40" height="54" viewBox="0 0 48 64"><path d="M24 4 C24 4 6 28 6 42 A18 18 0 0 0 42 42 C42 28 24 4 24 4Z" fill="#286B75"/></svg><span>Butuh <b>air bersih</b></span></div>
        <div class="need power" style="top:226px"><svg width="40" height="54" viewBox="0 0 48 64"><path d="M30 2 L6 36 L22 36 L16 62 L42 24 L26 24Z" fill="#A64F32"/></svg><span>Butuh <b>listrik</b>, juga malam hari</span></div>
        <div class="ctag" data-k="sea" style="left:96px;top:420px">Ombak datang siang &amp; malam<small>air laut di depannya = bahan baku air bersih</small></div>
        <svg data-hf-id="hf-hw9l" class="title" viewBox="0 0 1920 1080" width="1920" height="1080">
          <text data-hf-id="hf-htw5" x="960" y="640" text-anchor="middle">OWC-DESAL</text>
        </svg>
        <div data-hf-id="hf-p6ez" class="ask"></div>
      </div>

      <script>
        /*@ENGINE*/
        (() => {
          /*@MAP*/
          /*@BALI*/
          const NS = "http://www.w3.org/2000/svg";
          const root = document.getElementById("s1-root");
          const $ = (s) => root.querySelector(s);
          const { clamp, frac } = window.OWC;
          const subData = /*@SUBTITLE*/;
          const cue = window.OWC.cues(subData);
          const D = /*@SCENEDUR*/, tDive = cue("Kami", 1, 17.5) - 0.7, tCoast = tDive + 1.2;
          // first occurrence of a word at or after t0 (the question repeats words said earlier)
          const after = (w, t0, fb) => { for (let n = 1; n < 12; n++) { const x = cue(w, n, -1); if (x < 0) break; if (x >= t0 - 0.05) return x; } return fb; };
          const tAsk = cue("Bisakah", 1, 36.7), tTitle = after("bersih", tAsk, tAsk + 2.6) + 0.15;
          const sub = window.OWC.mountSubtitle(root, subData, { mute: [[tAsk - 0.1, D]] });
          const world = $(".world");
          const mk = (tag, attrs, parent) => {
            const e = document.createElementNS(NS, tag);
            for (const k in attrs) e.setAttribute(k, attrs[k]);
            parent.appendChild(e);
            return e;
          };

          // ---- map layers: coarse national outline, then a 1:10m Bali–Nusa Penida coast for the push-in ----
          MAP_DATA.neighbors.forEach((d) => mk("path", { d, stroke: "#4E9BDB", "stroke-opacity": 0.3, fill: "#2B78B8", "fill-opacity": 0.04 }, $(".nb")));
          const islands = MAP_DATA.indo.map((d) => mk("path", { d, stroke: "#4E9BDB", fill: "#93A28B" }, $(".indo")));
          BALI_DATA.paths.forEach((p) => mk("path", { d: p.d, stroke: "#4E9BDB", fill: p.closed ? "#93A28B" : "none", "fill-opacity": 0.24 }, $(".bali")));
          const swells = [];
          for (let k = 0; k < 6; k++) swells.push(mk("path", { fill: "none", stroke: "#367B86", "stroke-linecap": "round", opacity: 0 }, $(".swell")));
          // CSS camera scale does not reach SVG non-scaling strokes, so line weights are divided by zoom per frame
          const weights = [[$(".nb"), 1.4], [$(".indo"), 2.2], [$(".bali"), 2.2], [$(".swell"), 3.2]];

          // ---- the two named places get markers and labels pinned to the map through the camera ----
          const M = BALI_DATA.marks;
          const places = {
            kuta: { at: M.kuta, el: $('.place[data-k="kuta"]'), dx: -742, dy: 96, lx: -270, ly: 150 },
            penida: { at: M.penida, el: $('.place[data-k="penida"]'), dx: 178, dy: 64, lx: 178, ly: 118 },
          };
          for (const k in places) {
            const p = places[k];
            p.g = mk("g", { opacity: 0 }, $(".marks"));
            p.ring = mk("circle", { r: 12, fill: "none", stroke: "#A64F32", "stroke-width": 2.5 }, p.g);
            p.dot = mk("circle", { r: 8, fill: "#A64F32", stroke: "#F4EFE4", "stroke-width": 3 }, p.g);
            p.lead = mk("path", { fill: "none", stroke: "#293F3D", "stroke-width": 2, "stroke-opacity": 0.7 }, $(".leads"));
            p.lead.setAttribute("pathLength", "1");
            p.lead.style.strokeDasharray = "1 1";
            p.lead.style.strokeDashoffset = "1";
          }

          // ---- the question is said word by word, then the name answers it ----
          const askWords = ["Bisakah", "ombak", "menghasilkan", "listrik,", "|", "sekaligus", "air", "bersih?"];
          const ask = $(".ask");
          const wds = [];
          askWords.forEach((w) => {
            if (w === "|") { ask.appendChild(document.createElement("br")); return; }
            const s = document.createElement("span");
            s.className = "wd" + (w === "ombak" || w.startsWith("bersih") || w === "air" ? " hl" : w.startsWith("listrik") ? " en" : "");
            s.textContent = w;
            ask.appendChild(s);
            wds.push(s);
          });
          const askAt = ["Bisakah", "ombak", "menghasilkan", "listrik", "sekaligus", "air", "bersih"].map((w, i) => after(w, tAsk, tAsk + i * 0.35));

          const tl = gsap.timeline({ paused: true });

          // 1. Map draws west → east (already moving on frame 0)
          islands.forEach((p) => {
            const len = p.getTotalLength() * 1.02;
            p.style.strokeDasharray = `${len} ${len}`;
            p.style.strokeDashoffset = `${len}`;
            p.style.fillOpacity = 0;
          });
          tl.fromTo($(".nb"), { opacity: 0.35 }, { opacity: 1, duration: 1.0, ease: "power1.out" }, 0);
          const xs = MAP_DATA.indo.map((d) => parseFloat(d.slice(1)));
          islands.forEach((p, i) => {
            const at = 0.05 + ((xs[i] - 140) / 1640) * 1.9;
            tl.to(p, { strokeDashoffset: 0, duration: 1.1, ease: "power2.out" }, at);
            tl.to(p, { fillOpacity: 0.18, duration: 0.6, ease: "power1.out" }, at + 0.8);
          });

          // 2. Camera: slow drift, push into Bali as the first place is named, drift south to the ocean, then dive
          const cam = { s: 1, x: 0, y: 0 };
          const fr = (s, wx, wy, sx, sy) => ({ s, x: sx - s * wx, y: sy - s * wy });
          const toScreen = (wx, wy) => [cam.x + cam.s * wx, cam.y + cam.s * wy];
          const dot = $(".dot");
          const [tx, ty] = M.target;
          const applyCam = () => {
            world.style.transform = `translate(${cam.x.toFixed(2)}px, ${cam.y.toFixed(2)}px) scale(${cam.s.toFixed(4)})`;
            const [dx, dy] = toScreen(tx, ty);
            dot.style.transform = `translate(${(dx - 20).toFixed(1)}px, ${(dy - 20).toFixed(1)}px)`;
            for (const k in places) {
              const p = places[k];
              const [mx, my] = toScreen(...p.at);
              p.g.setAttribute("transform", `translate(${mx.toFixed(1)} ${my.toFixed(1)})`);
              p.el.style.left = `${(mx + p.dx).toFixed(1)}px`;
              p.el.style.top = `${(my + p.dy).toFixed(1)}px`;
              p.lead.setAttribute("d", `M${(mx + p.lx).toFixed(1)} ${(my + p.ly).toFixed(1)} L${(mx + Math.sign(p.lx) * 14).toFixed(1)} ${(my + 10).toFixed(1)}`);
            }
            const [ox, oy] = toScreen(866, 784);
            $(".sea-name").style.left = `${(ox - 120).toFixed(1)}px`;
            $(".sea-name").style.top = `${oy.toFixed(1)}px`;
            const [ex, ey] = toScreen(758.6, 773.8);
            $(".energy").style.left = `${ex.toFixed(1)}px`;
            $(".energy").style.top = `${ey.toFixed(1)}px`;
            weights.forEach(([g, w]) => g.setAttribute("stroke-width", (w / cam.s).toFixed(4)));
          };
          const tPush = cue("Kelingking", 1, 2.6) - 0.9;
          tl.fromTo(cam, { s: 1, x: 0, y: 0 }, { ...fr(1.05, 960, 560, 960, 540), duration: tPush, ease: "none", onUpdate: applyCam, immediateRender: true }, 0);
          tl.to(cam, { ...fr(8, 866, 743, 900, 470), duration: 2.3, ease: "power3.inOut", onUpdate: applyCam }, tPush);
          const tSea = cue("Padahal", 1, 10.3);
          tl.to(cam, { ...fr(8.35, 866, 743.5, 900, 470), duration: tSea - (tPush + 2.3), ease: "none", onUpdate: applyCam }, tPush + 2.3);
          tl.to(cam, { ...fr(7.1, 867, 752, 910, 405), duration: 2.4, ease: "power2.inOut", onUpdate: applyCam }, tSea);
          tl.to(cam, { ...fr(7.35, 867, 752, 910, 405), duration: tDive - (tSea + 2.4), ease: "none", onUpdate: applyCam }, tSea + 2.4);
          tl.to(cam, { ...fr(30, tx, ty, 690, 600), duration: 1.5, ease: "power3.in", onUpdate: applyCam }, tDive);
          tl.to($(".indo"), { opacity: 0, duration: 0.9, ease: "power1.inOut" }, tPush + 0.7);
          tl.fromTo($(".bali"), { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power1.inOut" }, tPush + 0.6);

          // 3. Places land as they are named: marker arrives from oversize, leader draws, label settles
          const land = (k, at) => {
            const p = places[k];
            tl.fromTo(p.g, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, at);
            tl.fromTo(p.dot, { attr: { r: 22 } }, { attr: { r: 8 }, duration: 0.42, ease: "power3.out" }, at);
            tl.to(p.lead, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, at + 0.12);
            tl.fromTo(p.el, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at + 0.2);
          };
          land("penida", Math.max(cue("Kelingking", 1, 2.6), tPush + 1.85));
          land("kuta", cue("Kuta", 1, 7.7));
          // when the sentence turns to the waves, the evidence steps back and the sea takes the frame
          tl.to([places.kuta.el, places.penida.el, places.kuta.lead, places.penida.lead], { opacity: 0, duration: 0.5, ease: "power2.in" }, tSea);
          // the energy side of the problem lands on "potensi energi laut", the number on "63 GW"
          const tPot = cue("potensi", 1, 10.8);
          tl.fromTo($(".energy"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, tPot - 0.1);
          tl.fromTo($(".energy .big"), { scale: 1.6, transformOrigin: "0% 80%" }, { scale: 1, duration: 0.55, ease: "power3.out" }, cue("63", 1, 12.9) - 0.05);
          tl.fromTo($(".energy .what"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, cue("belum", 2, 14.6) - 0.1);
          tl.to([places.kuta.el, places.penida.el, places.kuta.lead, places.penida.lead, places.kuta.g, places.penida.g, $(".sea-name"), $(".energy")], { opacity: 0, duration: 0.4, ease: "power2.in" }, tDive - 0.1);

          // 4. Question at speech rhythm, then the name lands above it
          wds.forEach((w, i) => {
            const at = (askAt[Math.min(i, askAt.length - 1)] || tAsk + i * 0.3) - 0.04;
            tl.fromTo(w, { opacity: 0, yPercent: 45 }, { opacity: 1, yPercent: 0, duration: 0.38, ease: "power3.out" }, at);
          });
          const tt = root.querySelector(".title text");
          tl.fromTo($(".title"), { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none", immediateRender: true }, tTitle);
          tl.to(tt, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, tTitle);
          tl.to(tt, { fillOpacity: 1, duration: 0.3, ease: "power1.out" }, tTitle + 0.2);
          // push-through: copy accelerates away with the dive, the coast point carries into Scene 2
          tl.to($(".title"), { scale: 1.12, opacity: 0, duration: 0.5, ease: "power2.in" }, D - 0.95);
          tl.to(ask, { y: 40, opacity: 0, duration: 0.42, ease: "power2.in" }, D - 1.0);
          tl.fromTo(dot, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, tDive + 0.1);
          tl.to($(".map"), { opacity: 0, duration: 0.45, ease: "power1.in" }, tDive + 1.0);


          // 5. The proposed use, drawn as the same coast Scene 2 builds on: sea left, cliff at x 560, land at y 500
          const coast = $(".coast");
          const cg = (sel) => coast.querySelector(sel);
          const ink = { fill: "#E5E2D5", stroke: "#293F3D", "stroke-width": 2.5, "stroke-linejoin": "round" };
          const build = [];
          const toilet = mk("g", {}, cg(".c-build"));
          mk("path", { d: "M660 500 V392 H860 V500", ...ink }, toilet);
          mk("path", { d: "M648 394 L760 350 L872 394Z", ...ink, fill: "#C8C7B9" }, toilet);
          mk("rect", { x: 700, y: 432, width: 34, height: 68, fill: "#C8C7B9", stroke: "#293F3D", "stroke-width": 2 }, toilet);
          mk("rect", { x: 786, y: 432, width: 34, height: 68, fill: "#C8C7B9", stroke: "#293F3D", "stroke-width": 2 }, toilet);
          mk("path", { d: "M760 404 C760 404 750 418 750 425 A10 10 0 0 0 770 425 C770 418 760 404 760 404Z", fill: "#286B75" }, toilet);
          build.push(toilet);
          for (let i = 0; i < 5; i++) {
            const x = 920 + i * 110, k = mk("g", {}, cg(".c-build"));
            mk("path", { d: `M${x} 500 V438 H${x + 92} V500`, ...ink }, k);
            mk("path", { d: `M${x - 8} 440 L${x + 4} 418 H${x + 88} L${x + 100} 440Z`, fill: "#A64F32", stroke: "#293F3D", "stroke-width": 2, "stroke-linejoin": "round" }, k);
            for (let j = 1; j < 4; j++) mk("path", { d: `M${x + 4 + j * 24} 418 L${x - 8 + j * 27} 440`, stroke: "#F4EFE4", "stroke-width": 5, "stroke-opacity": 0.7 }, k);
            mk("rect", { x: x + 14, y: 462, width: 64, height: 10, fill: "#C8C7B9" }, k);
            build.push(k);
          }
          const lamps = [], cones = [];
          for (let i = 0; i < 8; i++) {
            const x = 640 + i * 177, g = mk("g", {}, cg(".c-lamps"));
            mk("path", { d: `M${x} 548 V432 H${x + 18}`, fill: "none", stroke: "#293F3D", "stroke-width": 4, "stroke-linecap": "round" }, g);
            mk("path", { d: `M${x + 10} 430 H${x + 34} L${x + 30} 440 H${x + 14}Z`, fill: "#293F3D" }, g);
            cones.push(mk("path", { d: `M${x + 15} 442 H${x + 29} L${x + 58} 548 H${x - 14}Z`, fill: "#F2C27B" }, cg(".c-cones")));
            lamps.push(g);
          }
          const people = [];
          for (let i = 0; i < 10; i++) {
            const x = 930 + i * 52 + (i % 3) * 6, h = 34 + ((i * 7) % 3) * 4, g = mk("g", {}, cg(".c-people"));
            mk("circle", { cx: x, cy: 548 - h - 9, r: 8, fill: "#293F3D" }, g);
            mk("path", { d: `M${x - 9} 548 V${548 - h + 10} Q${x} ${548 - h - 2} ${x + 9} ${548 - h + 10} V548Z`, fill: i % 2 ? "#367B86" : "#676953" }, g);
            people.push(g);
          }
          const tags = {};
          root.querySelectorAll(".ctag").forEach((e) => { tags[e.dataset.k] = e; });
          const tag = (k) => tags[k];
          tl.fromTo(coast, { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, tCoast);
          const tFac = Math.max(cue("fasilitas", 1, 20.5) - 0.1, tCoast + 0.5);
          tl.fromTo(build, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.08 }, tFac);
          tl.fromTo(lamps, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.05 }, tFac + 0.3);
          const tVis = cue("200", 1, 22.3);
          tl.fromTo(people, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.05 }, tVis - 0.1);
          tl.fromTo(tag("visit"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, tVis - 0.05);
          [["toilet", "toilet"], ["kios", "kios"], ["lampu", "lampu"]].forEach(([k, w]) =>
            tl.fromTo(tag(k), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, cue(w, 1, 24) - 0.08));
          // the two needs, then night: the lamps are needed exactly when there is no sun
          tl.fromTo($(".need.water"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, cue("air", 3, 28.3) - 0.1);
          tl.fromTo($(".need.power"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, cue("listrik", 1, 29.2) - 0.1);
          const tNight = cue("malam", 1, 30.3) - 0.2, tDay = cue("tepat", 1, 33.6);
          tl.to(cg(".c-night"), { opacity: 0.34, duration: 0.7, ease: "power2.inOut" }, tNight);
          tl.to(cg(".c-cones"), { opacity: 0.75, duration: 0.6, ease: "power2.out" }, tNight + 0.25);
          tl.fromTo(tag("sea"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, cue("Ombak", 1, 31.3) - 0.1);
          tl.to(cg(".c-night"), { opacity: 0, duration: 0.8, ease: "power2.inOut" }, tDay);
          tl.to(cg(".c-cones"), { opacity: 0, duration: 0.6, ease: "power2.in" }, tDay + 0.1);
          // the question takes the frame; the coast stays behind it, then hands its shoreline to Scene 2
          const coastText = [...root.querySelectorAll(".ctag"), $(".need.water"), $(".need.power")];
          tl.to(coastText, { opacity: 0, y: -10, duration: 0.4, ease: "power2.in" }, tAsk - 0.45);
          tl.to(coast, { opacity: 0.22, duration: 0.6, ease: "power2.inOut" }, tAsk - 0.4);
          // hand-off: the facility clears and the bare coast comes back to full strength, as Scene 2 opens on it
          tl.to([cg(".c-build"), cg(".c-people"), cg(".c-lamps"), cg(".c-walk")], { opacity: 0, duration: 0.45, ease: "power2.in" }, D - 1.0);
          tl.to(coast, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, D - 0.85);
          const tick = { t: 0 };
          const swellOn = (t) => clamp((t - (tSea - 0.3)) / 1.2, 0, 1) * (1 - clamp((t - (tDive - 0.4)) / 0.5, 0, 1));
          const update = (t) => {
            if (sub) sub.update(t);
            for (const k in places) {
              const s = frac(t * 0.7 + (k === "kuta" ? 0.4 : 0));
              places[k].ring.setAttribute("r", (10 + s * 26).toFixed(1));
              places[k].ring.setAttribute("stroke-opacity", (0.8 * (1 - s)).toFixed(3));
            }
            // waves keep rolling in toward the cliff of the proposed site
            if (t > tCoast - 0.2) {
              let d = "";
              for (let x = -10; x <= 560; x += 10) {
                const y = 600 + 9 * Math.sin(0.012 * x - 2.1 * t) * Math.min(1, (570 - x) / 60) + 3 * Math.sin(0.04 * x + 1.3 * t);
                d += (x === -10 ? "M" : "L") + x + " " + y.toFixed(1) + " ";
              }
              cg(".c-crest").setAttribute("d", d);
              cg(".c-sea").setAttribute("d", d + "L560 790 L-10 985Z");
            }
            // swell crests travel north toward the coast: the "ombak tak pernah berhenti" beat
            const on = swellOn(t);
            swells.forEach((p, k) => {
              const u = frac(t * 0.13 + k / swells.length);
              const y = 806 - u * 50;
              const cx = 890 + ((k * 37) % 40), half = 15 + ((k * 13) % 10);
              p.setAttribute("d", `M${(cx - half).toFixed(2)} ${(y + 0.9).toFixed(2)} Q${cx.toFixed(2)} ${(y - 1.6).toFixed(2)} ${(cx + half).toFixed(2)} ${(y + 0.9).toFixed(2)}`);
              p.setAttribute("opacity", (on * Math.sin(Math.PI * u)).toFixed(3));
            });
          };
          tl.fromTo(tick, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => update(tick.t) }, 0);
          applyCam();
          update(0);

          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
