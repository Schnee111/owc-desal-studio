<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template id="s1-template">
      <style>
        /*@CSS*/
        #s1-root .map path { fill: none; stroke-linejoin: round; }
        #s1-root .ocean {
          font: 700 24px "IBM Plex Mono", monospace;
          letter-spacing: 0.35em;
          fill: #4e9bdb;
        }
        #s1-root .stat {
          position: absolute;
          right: 84px;
          top: 64px;
          text-align: right;
        }
        #s1-root .stat .kick {
          font: 700 26px/1.2 Inter, sans-serif;
          color: #e8eef4;
          opacity: 0;
        }
        #s1-root .stat .val {
          display: block;
          margin-top: 10px;
          font: 900 110px/1 Montserrat, sans-serif;
          color: #ff9f1c;
          transform-origin: 100% 60%;
          opacity: 0;
        }
        #s1-root .stat .num {
          display: inline-block;
          width: auto;
          text-align: right;
          font-variant-numeric: tabular-nums;
        }
        #s1-root .stat .unit {
          display: inline-block;
          opacity: 0;
        }
        #s1-root .veil {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse 980px 420px at 50% 52%, rgba(10, 14, 20, 0.92), rgba(10, 14, 20, 0.55) 60%, rgba(10, 14, 20, 0) 100%);
          opacity: 0;
        }
        #s1-root .title {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
        }
        #s1-root .title text {
          font: 900 150px Montserrat, sans-serif;
          letter-spacing: 0.02em;
          fill: #e8eef4;
          fill-opacity: 0;
          stroke: #e8eef4;
          stroke-width: 2.5;
          stroke-dasharray: 1400 1400;
          stroke-dashoffset: 1400;
        }
        #s1-root .sub {
          position: absolute;
          left: 0;
          right: 0;
          top: 608px;
          text-align: center;
          font: 700 42px/1.2 Inter, sans-serif;
          color: #e8eef4;
          opacity: 0;
        }
        #s1-root .rule {
          position: absolute;
          left: 700px;
          top: 676px;
          width: 520px;
          height: 4px;
          border-radius: 2px;
          background: #ff9f1c;
          transform-origin: 50% 50%;
        }
        #s1-root .dot {
          position: absolute;
          left: 0;
          top: 0;
          width: 40px;
          height: 40px;
          border-radius: 50%;
          background: radial-gradient(circle, #fff6c9 0 22%, #ffd23f 30%, rgba(255, 210, 63, 0) 70%);
          opacity: 0;
        }
      </style>

      <div data-hf-id="hf-q5wv" id="s1-root" data-composition-id="s1" data-width="1920" data-height="1080" data-duration="20">
        <div data-hf-id="hf-12x1" class="cam">
          <div data-hf-id="hf-oy59" class="world" data-layout-allow-overflow="">
            <svg data-hf-id="hf-j0sq" class="dg map" viewBox="0 0 1920 1080" width="1920" height="1080">
              <g data-hf-id="hf-nk76" class="nb" />
              <g data-hf-id="hf-90m9" class="glow" />
              <g data-hf-id="hf-faq0" class="indo" />
              <g data-hf-id="hf-t566" class="dots" />
              <text data-hf-id="hf-6nzu" class="ocean" x="430" y="905" opacity="0">SAMUDRA HINDIA</text>
            </svg>
          </div>
          <div data-hf-id="hf-lu65" class="dot"></div>
        </div>
        <div class="context-card">
          <div class="ckick">Konteks Masalah Pesisir &amp; Wisata</div>
          <div class="cbody">Jaringan air bersih belum menjangkau titik pantai wisata &amp; air tanah pesisir terintrusi asin (TDS 10.000–20.000 mg/L).</div>
          <div class="csrc">Studi kasus: Kelingking &amp; Broken Beach (Mei 2026) · Kajian Pesisir Kuta Utara (2024)</div>
        </div>
        <div data-hf-id="hf-xa0m" class="stat">
          <div data-hf-id="hf-pbg0" class="kick">Sasaran skenario layanan</div>
          <div data-hf-id="hf-ez9w" class="val"><span data-hf-id="hf-kg25" class="num">1</span><span data-hf-id="hf-gwyd" class="unit">fasilitas wisata</span></div>
          <div class="sub-stat">200 pengunjung/hari · 5 kios · petugas &amp; 8 lampu jalur</div>
        </div>
        <div data-hf-id="hf-h5f4" class="veil"></div>
        <svg data-hf-id="hf-hw9l" class="title" viewBox="0 0 1920 1080" width="1920" height="1080">
          <text data-hf-id="hf-mwry" x="960" y="545" text-anchor="middle">OWC-DESAL</text>
        </svg>
        <div data-hf-id="hf-u6kb" class="sub">Energi ombak untuk layanan air bersih pesisir</div>
        <div data-hf-id="hf-qgl5" class="rule" style="opacity: 0"></div>
        <div class="scope-note">Skenario desain konsep · Lokasi dan keluaran alat memerlukan pengujian lapangan</div>
      </div>

      <script>
        /*@ENGINE*/
        (() => {
          /*@MAP*/
          const NS = "http://www.w3.org/2000/svg";
          const root = document.getElementById("s1-root");
          const $ = (s) => root.querySelector(s);
          const world = $(".world");
          const sub = window.OWC ? window.OWC.mountSubtitle(root, /*@SUBTITLE*/) : null;
          const mk = (tag, attrs, parent) => {
            const e = document.createElementNS(NS, tag);
            for (const k in attrs) e.setAttribute(k, attrs[k]);
            parent.appendChild(e);
            return e;
          };
          MAP_DATA.neighbors.forEach((d) =>
            mk("path", { d, stroke: "#4E9BDB", "stroke-opacity": 0.3, "stroke-width": 1.4, fill: "#2B78B8", "fill-opacity": 0.05 }, $(".nb")));
          const islands = MAP_DATA.indo.map((d) => mk("path", { d, stroke: "#4E9BDB", "stroke-width": 2.2, fill: "#2B78B8" }, $(".indo")));
          MAP_DATA.indo.forEach((d) => mk("path", { d, stroke: "#4E9BDB", "stroke-width": 7, "stroke-opacity": 0.5 }, $(".glow")));
          const glow = $(".glow");
          const dots = MAP_DATA.dots.map(([x, y]) => {
            const g = mk("g", { opacity: 0 }, $(".dots"));
            const ring = mk("circle", { cx: x, cy: y, r: 9, fill: "none", stroke: "#FFD23F", "stroke-width": 2.5 }, g);
            mk("circle", { cx: x, cy: y, r: 13, fill: "#FFD23F", "fill-opacity": 0.22 }, g);
            mk("circle", { cx: x, cy: y, r: 6.5, fill: "#FFD23F" }, g);
            return { g, ring, x };
          });

          const tl = gsap.timeline({ paused: true });

          // 1. Map draws west -> east (0.5s - 4.0s) while VO says "Di kawasan wisata pesisir, air bersih dibutuhkan pengunjung, kios, dan petugas" (1.1s - 6.3s)
          gsap.set(glow, { opacity: 0 });
          islands.forEach((p) => {
            const len = p.getTotalLength() * 1.02;
            p.style.strokeDasharray = `${len} ${len}`;
            p.style.strokeDashoffset = `${len}`;
            p.style.fillOpacity = 0;
          });
          tl.fromTo($(".nb"), { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power1.out" }, 0.4);
          const xs = MAP_DATA.indo.map((d) => parseFloat(d.slice(1)));
          islands.forEach((p, i) => {
            const at = 0.6 + ((xs[i] - 140) / 1640) * 2.2;
            tl.to(p, { strokeDashoffset: 0, duration: 1.3, ease: "power2.out" }, at);
            tl.to(p, { fillOpacity: 0.16, duration: 0.7, ease: "power1.out" }, at + 1.0);
          });
          tl.fromTo(root.querySelector(".ocean"), { opacity: 0 }, { opacity: 0.85, duration: 0.7, ease: "power1.out" }, 2.6);
          dots.forEach((d) => {
            tl.fromTo(d.g, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 2.5 + ((d.x - 180) / 1000) * 1.2);
          });

          // 2. Context card appears at t=2.2s (dwell 16.0s!) grounding the coastal water problem
          tl.fromTo($(".context-card"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 2.2);

          // 3. VO says "O W C Desal mengkaji energi ombak untuk membantu satu fasilitas wisata" at t=7.3s - 11.35s
          // Sync title "OWC-DESAL" at t=7.0s AND target stat "1 fasilitas wisata" at t=9.2s!
          tl.fromTo($(".stat .kick"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 9.0);
          tl.fromTo($(".stat .val"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 9.3);
          tl.fromTo($(".stat .unit"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out" }, 9.6);
          tl.fromTo($(".stat .sub-stat"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out" }, 10.0);

          // Title OWC-DESAL draws cleanly in center starting at t=11.8s and stays visible with context & stat cards!
          tl.to($(".veil"), { opacity: 1, duration: 0.8, ease: "power1.inOut" }, 11.6);
          const tt = root.querySelector(".title text");
          tl.to(tt, { strokeDashoffset: 0, duration: 1.6, ease: "power2.out" }, 11.8);
          tl.to(tt, { fillOpacity: 1, duration: 0.7, ease: "power1.out" }, 12.9);
          tl.fromTo($(".rule"), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.65, ease: "power3.out" }, 13.1);
          tl.fromTo($(".sub"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 13.3);
          tl.fromTo($(".scope-note"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 13.7);

          // 4. Camera drift & dive to coast (18.25s - 20.0s)
          const [tx, ty] = MAP_DATA.target;
          const cam = { s: 1, x: 0, y: 0 };
          const dot = $(".dot");
          const apply = () => {
            world.style.transform = `translate(${cam.x.toFixed(2)}px, ${cam.y.toFixed(2)}px) scale(${cam.s.toFixed(4)})`;
            dot.style.transform = `translate(${(cam.x + cam.s * tx - 20).toFixed(1)}px, ${(cam.y + cam.s * ty - 20).toFixed(1)}px)`;
          };
          apply();
          const fr = (s, wx, wy, sx, sy) => ({ s, x: sx - s * wx, y: sy - s * wy });
          tl.fromTo(cam, { s: 1, x: 0, y: 0 }, { ...fr(1.035, 960, 560, 960, 540), duration: 18.2, ease: "none", onUpdate: apply }, 0);
          tl.to([$(".title"), $(".sub"), $(".rule"), $(".stat"), $(".context-card"), $(".scope-note"), $(".veil")], { opacity: 0, duration: 0.55, ease: "power1.in" }, 18.2);
          tl.fromTo(dot, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 18.4);
          tl.to(cam, { ...fr(7, tx, ty, 690, 600), duration: 1.75, ease: "power3.in", onUpdate: apply }, 18.25);
          tl.to($(".map"), { opacity: 0, duration: 0.7, ease: "power1.in" }, 19.3);

          const tick = { t: 0 };
          tl.fromTo(tick, { t: 0 }, {
            t: 20, duration: 20, ease: "none",
            onUpdate: () => {
              const t = tick.t;
              if (sub) sub.update(t);
              glow.style.opacity = t < 5.6 ? 0 : (0.18 + 0.22 * Math.sin((t - 5.6) * 1.6 - Math.PI / 2) + 0.22) * Math.min(1, (t - 5.6) / 1.2);
              dots.forEach((d, i) => {
                const s = (t * 0.55 + i * 0.137) % 1;
                d.ring.setAttribute("r", (9 + s * 22).toFixed(1));
                d.ring.setAttribute("stroke-opacity", (0.85 * (1 - s)).toFixed(3));
              });
            },
          }, 0);

          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
