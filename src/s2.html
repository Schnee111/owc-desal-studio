<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template id="s2-template">
      <style>
        /*@CSS*/
        
        #s2-root .hdr .m { font: 700 26px "IBM Plex Mono", monospace; letter-spacing: 0.12em; color: #9beaff; margin-left: 10px; }
        #s2-root .dot {
          position: absolute;
          left: 670px;
          top: 580px;
          width: 40px;
          height: 40px;
          border-radius: 50%;
          background: radial-gradient(circle, #fff6c9 0 22%, #ffd23f 30%, rgba(255, 210, 63, 0) 70%);
        }
      </style>

      <div data-hf-id="hf-bx0t" id="s2-root" data-composition-id="s2" data-width="1920" data-height="1080" data-duration="{{SCENE_DUR}}">
        <div data-hf-id="hf-12x1" class="cam">
          <div data-hf-id="hf-oy59" class="world" data-layout-allow-overflow="">
            <div data-hf-id="hf-wajx" class="lbl hide" data-k="chamber" style="left: 332px; top: 372px" data-leader="507,390,560,404">Chamber OWC (Kolom Air)</div>
            <div data-hf-id="hf-xb8d" class="lbl hide" data-k="air-col" style="left: 330px; top: 450px" data-leader="480,468,646,470">Kolom udara</div>
            <div data-hf-id="hf-hzme" class="lbl hide" data-k="water-col" style="left: 330px; top: 652px" data-leader="462,670,650,662">Kolom air</div>
            <div data-hf-id="hf-xjij" class="lbl hide" data-k="turbine" style="left: 382px; top: 168px" data-leader="560,186,642,200">Turbin Wells (Udara)</div>
            <div data-hf-id="hf-oktx" class="lbl hide k-energy" data-k="gen" style="left: 760px; top: 104px" data-leader="844,144,844,180">Generator</div>
            <div data-hf-id="hf-silv" class="lbl hide k-energy" data-k="cond" style="left: 912px; top: 104px" data-leader="943,144,943,191">Pengondisi daya</div>
            <div data-hf-id="hf-iysi" class="lbl hide" data-k="building" style="left: 1016px; top: 262px">Gedung desalinasi Osmosis Balik (RO)</div>
            <div data-hf-id="hf-kmwd" class="lbl hide" data-k="intake" style="left: 168px; top: 742px" data-leader="338,760,398,818">Intake air laut</div>
            <div data-hf-id="hf-jhro" class="lbl hide wrap" data-k="filter" style="left: 834px; top: 402px" data-leader="996,433,1040,433">Filter pra-pengolahan</div>
            <div data-hf-id="hf-3zht" class="lbl hide" data-k="pump" style="left: 1122px; top: 516px" data-leader="1220,516,1220,488">Pompa tekanan tinggi</div>
            <div data-hf-id="hf-id9d" class="lbl hide" data-k="membrane" style="left: 1272px; top: 334px" data-leader="1400,372,1400,398">Membran Osmosis Balik</div>
            <div data-hf-id="hf-1mrc" class="lbl hide k-fresh" data-k="post" style="left: 1420px; top: 386px" data-leader="1531,422,1531,440">Pascapengolahan</div>
            <div data-hf-id="hf-jca6" class="lbl hide k-fresh" data-k="tank" style="left: 1585px; top: 516px" data-leader="1620,516,1620,495">Tangki air bersih</div>
            <div data-hf-id="hf-zkun" class="lbl hide k-brine" data-k="brine" style="left: 760px; top: 944px" data-leader="835,944,835,940">Saluran brine (air pekat)</div>
          </div>
          <div data-hf-id="hf-lu65" class="dot"></div>
        </div>
        <div data-hf-id="hf-tyyu" class="hdr"><span data-hf-id="hf-2drr" class="k">Potongan</span> OWC-DESAL</div>
      </div>

      <script>
        /*@ENGINE*/
        (() => {
          const root = document.getElementById("s2-root");
          const $ = (s) => root.querySelector(s);
          const world = $(".world");
          const { ramp } = window.OWC;
          const SUB = /*@SUBTITLE*/;
          const LEG = /*@LEGACY*/, D = /*@SCENEDUR*/;
          // beats below were authored against the original take; T maps them onto the current narration
          const T = LEG ? window.OWC.warp(LEG.words, LEG.offset, LEG.duration, SUB, D) : Object.assign((x) => x, { timeline: (tl) => tl });
          const sub = window.OWC.mountSubtitle(root, SUB);
          const W = window.OWC.build(world, {
            prefix: "s2",
            scene: 2,
            fn: { lipOn: (t) => (t >= T(4.0) ? 1 : 0), innerFill: (t) => ramp(t, T(8.2), T(9.8)), tank: () => 0.3, glow: (t) => ramp(t, T(13.4), T(14.8)), power: (t) => ramp(t, T(15.2), T(16.0)) },
          });
          const L = W.L;
          W.update(0);
          gsap.set(L.arrows, { opacity: 0 });
          const tl = T.timeline(gsap.timeline({ paused: true }));

          const geo = (g) => (g.matches && g.matches("path,rect,circle,line") ? [g] : [...g.querySelectorAll("path,rect,circle,line")]);
          function draw(targets, at, dur, opts = {}) {
            const list = [].concat(targets).flatMap(geo);
            const strokes = list.filter((e) => (e.getAttribute("stroke") || "none") !== "none");
            W.prepDraw(strokes);
            strokes.forEach((e, i) => tl.to(e, { strokeDashoffset: 0, duration: dur, ease: opts.ease || "power2.out" }, at + i * (opts.stagger || 0)));
            list.forEach((e) => {
              const fill = e.getAttribute("fill");
              if (fill && fill !== "none" && !opts.keepFill) {
                const fo = parseFloat(e.getAttribute("fill-opacity") || "1");
                e.style.fillOpacity = 0;
                tl.to(e, { fillOpacity: fo, duration: 0.55, ease: "power1.out" }, at + dur * 0.75);
              }
            });
          }
          const fadeIn = (t, at, d = 0.55) => tl.fromTo(t, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, at);
          const lblMap = {};
          root.querySelectorAll(".lbl").forEach((e) => { lblMap[e.dataset.k] = e; });
          const lbl = (k) => lblMap[k];
          function label(k, at) {
            const el = lbl(k);
            if (!el) return;
            tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, at);
            const ld = W.leaders.get(el);
            if (ld) tl.fromTo(ld, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, at + 0.08);
          }

          const guide = document.createElementNS("http://www.w3.org/2000/svg", "g");
          W.svg.insertBefore(guide, W.svg.firstChild.nextSibling);
          const gl = ["M690 600 L-120 600", "M690 600 L1960 600"].map((d) => {
            const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
            p.setAttribute("d", d); p.setAttribute("stroke", "#FFD23F"); p.setAttribute("stroke-width", "2.5"); p.setAttribute("stroke-dasharray", "10 8");
            guide.appendChild(p); return p;
          });
          tl.fromTo(gl[0], { attr: { d: "M690 600 L690 600" } }, { attr: { d: "M690 600 L-120 600" }, duration: 0.7, ease: "power3.out" }, 0.0);
          tl.fromTo(gl[1], { attr: { d: "M690 600 L690 600" } }, { attr: { d: "M690 600 L1960 600" }, duration: 0.7, ease: "power3.out" }, 0.0);
          tl.to(guide, { opacity: 0, duration: 1.0, ease: "power1.inOut" }, 1.6);
          tl.fromTo($(".dot"), { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.3, duration: 0.65, ease: "power2.in" }, 0.25);

          [L.sea, L.chamber, L.air, L.turbine, L.gen, L.power, L.building, L.pipes].forEach((g) => gsap.set(g, { opacity: 1 }));
          // Before the chamber exists the coast is solid rock at the waterline; the shell is cut into it.
          const cliff = document.createElementNS("http://www.w3.org/2000/svg", "g");
          W.svg.insertBefore(cliff, L.chamber);
          const cliffFill = document.createElementNS("http://www.w3.org/2000/svg", "path");
          cliffFill.setAttribute("d", "M560 500 L820 500 L820 797 L560 797Z");
          cliffFill.setAttribute("fill", "#DED4BD");
          const cliffEdge = document.createElementNS("http://www.w3.org/2000/svg", "path");
          cliffEdge.setAttribute("d", "M560 790 L560 500 L820 500");
          cliffEdge.setAttribute("fill", "none");
          cliffEdge.setAttribute("stroke", "#293F3D");
          cliffEdge.setAttribute("stroke-width", "3");
          cliff.appendChild(cliffFill);
          cliff.appendChild(cliffEdge);
          tl.fromTo(cliff, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.35);
          tl.to(cliff, { opacity: 0, duration: 0.7, ease: "power2.in" }, 3.4);
          gsap.set(L.cw, { opacity: 0 });

          fadeIn(L.sea, 0.25, 0.8);
          tl.fromTo(L.innerWater, { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power1.out", immediateRender: true }, 4.0);
          draw(L.seabed, 0.3, 1.0, { ease: "power1.inOut" });
          fadeIn(L.earthFill, 0.35, 0.8);
          draw(L.land, 0.45, 0.8);
          fadeIn($(".hdr"), 0.8, 0.55);

          // Chamber (VO: "ruang Kolom Air Berosilasi" at 4.25s, "kolom air" at 9.05s, "kolom udara" at 11.25s)
          L.shell.forEach((s, i) => {
            draw(s.stroke, 2.8 + i * 0.45, 1.2);
            s.fills.forEach((f) => { f.style.opacity = 0; tl.to(f, { opacity: 1, duration: 0.65, ease: "power1.out" }, 4.0 + i * 0.25); });
          });
          label("chamber", 4.6);
          label("water-col", 8.8);
          fadeIn(L.air, 10.6, 0.7);
          label("air-col", 11.1);

          // Duct, Wells turbine, generator, power conditioner (VO: "turbin udara dan generator" at 14.09s - 15.72s)
          draw(L.duct, 12.2, 0.65);
          draw(L.casing, 12.6, 0.7);
          [L.blades, L.hub].forEach((e) => fadeIn(e, 13.1, 0.45));
          label("turbine", 13.8);
          draw(L.shaft, 14.0, 0.35);
          draw([L.genBox, L.coil], 14.2, 0.55);
          label("gen", 14.8);
          draw(L.pwStub.base, 15.0, 0.45);
          tl.fromTo(L.junction, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 15.3);
          draw(L.conditioner, 15.3, 0.45);
          label("cond", 15.6);
          gsap.set([L.pwStub.flow], { opacity: 0 });

          // RO building & train started earlier (16.2s - 20.6s) so every label has >= 3.8s dwell time before 24.5s!
          draw([L.bOutline], 16.1, 1.1, { keepFill: false });
          draw(L.bRoof, 16.9, 0.5);
          label("building", 17.3);
          draw([L.pIntake.outer, L.pIntake.inner], 17.5, 0.8, { keepFill: true });
          fadeIn(L.screen, 17.8, 0.35);
          label("intake", 18.0);
          draw(L.filter, 18.1, 0.55);
          label("filter", 18.5);
          draw([L.pFeed1.outer, L.pFeed1.inner], 18.5, 0.35, { keepFill: true });
          draw([...L.pump.children].filter((e) => e !== L.impeller), 18.7, 0.5);
          fadeIn(L.impeller, 19.0, 0.35);
          label("pump", 19.1);
          draw([L.pFeed2.outer, L.pFeed2.inner], 19.1, 0.35, { keepFill: true });
          draw(L.module, 19.3, 0.55);
          label("membrane", 19.6);
          draw([L.pPerm.outer, L.pPerm.inner], 19.7, 0.35, { keepFill: true });
          draw(L.post, 19.9, 0.4);
          label("post", 20.1);
          draw(L.tank, 20.1, 0.6);
          label("tank", 20.5);
          draw([L.pTap.outer, L.pTap.inner], 20.5, 0.45, { keepFill: true });
          draw(L.tap, 20.7, 0.45);
          draw([L.pBrine.outer, L.pBrine.inner], 20.7, 0.9, { keepFill: true });
          draw(L.diffuser, 21.1, 0.35);
          label("brine", 21.1);

          // Hold all labels until 24.5s (gives every label 3.4s - 19.9s of comfortable reading time!)
          const allL = [...root.querySelectorAll(".lbl")];
          tl.to(allL, { opacity: 0, duration: 0.45, ease: "power1.in" }, 24.5);
          tl.to([...W.leaders.values()], { opacity: 0, duration: 0.45, ease: "power1.in" }, 24.5);

          W.applyCam();
          W.update(0);
          const clock = { t: 0 };
          tl.fromTo(clock, { t: 0 }, {
            t: D, duration: D, ease: "none",
            onUpdate: () => {
              W.update(clock.t);
              if (sub) sub.update(clock.t);
            },
          }, 0);

          window.__timelines["s2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
