<!doctype html><html lang="id"><head><meta charset="utf-8"></head><body><template>
<style>/*@CSS*/</style>
<div data-hf-id="hf-t4n6" id="s8-root" data-composition-id="s8" data-width="1920" data-height="1080" data-duration="{{SCENE_DUR}}">
 <div data-hf-id="hf-12x1" class="cam"><div data-hf-id="hf-oy59" class="world" data-layout-allow-overflow="">
  <div data-hf-id="hf-t5om" class="ro-standby-badge">Pompa RO berhenti, jalan lagi saat ombak pulih</div>
 </div></div>
 <div data-hf-id="hf-mqav" class="reserve-ui">
  <div data-hf-id="hf-4q5g" class="service-intro">
   <h1 data-hf-id="hf-rhsw">Ketika ombak melemah.</h1>
   <h2 data-hf-id="hf-huxf" class="reserve-state">Listrik dari ombak menurun</h2>
   <div data-hf-id="hf-09kq" class="generation-meter"><i data-hf-id="hf-wt6k"></i></div>
   <p data-hf-id="hf-zot3" class="service-small">keluaran generator, relatif terhadap ombak normal</p>
   <ul data-hf-id="hf-3qvx" class="steps">
    <li data-hf-id="hf-o6jr" class="st-tank"><b data-hf-id="hf-hxse">Keran</b> tetap mengalir dari tangki {{reserve}} m³</li>
    <li data-hf-id="hf-ox62" class="st-bat"><b data-hf-id="hf-nnt5">Baterai</b> {{battery}} kWh hanya untuk lampu &amp; kontrol</li>
    <li data-hf-id="hf-tz3w" class="st-op"><b data-hf-id="hf-ocn1">Operator</b> memantau mutu air, kondisi alat &amp; pembuangan air garam</li>
   </ul>
  </div>
  <div data-hf-id="hf-qi62" class="reserve-ledger">
   <div data-hf-id="hf-zlo4" class="reserve-card tank-card">
    <strong data-hf-id="hf-2mbm">{{reserve}} m³</strong>
    <h2 data-hf-id="hf-tnfl">air cadangan di tangki</h2>
    <p data-hf-id="hf-qu9a">Untuk 2 hari pemakaian (2 × {{water}} m³) jika tangki penuh; dialirkan secara gravitasi.</p>
   </div>
   <div data-hf-id="hf-5ds1" class="reserve-card bat-card">
    <strong data-hf-id="hf-wmut">{{battery}} kWh</strong>
    <h2 data-hf-id="hf-i6gr">baterai nominal</h2>
    <p data-hf-id="hf-2her">{{lamps}} lampu jalur &amp; sistem kontrol ≈ 2,4 kWh/hari. Kios dipadamkan, pompa RO tidak ikut.</p>
   </div>
  </div>
 </div>
</div>
<script>/*@ENGINE*/
(()=>{
 const S=/*@DATA*/,root=document.getElementById('s8-root'),q=s=>root.querySelector(s),{ramp}=OWC;
 const SUB=/*@SUBTITLE*/,cue=OWC.cues(SUB),D=/*@SCENEDUR*/;
 const sub=window.OWC.mountSubtitle(root,SUB);
 const pumpAngle=t=>{const u=Math.min(1,Math.max(0,(t-3)/5));return 300*(121+t-5*(u**3-.5*u**4)-Math.max(0,t-8));};
 const W=OWC.build(q('.world'),{prefix:'s8',scene:8,fn:{gridOn:()=>1,pump:t=>1-ramp(t,3,8),pumpAngle,ro:t=>1-ramp(t,3,8),tapOn:()=>1,tank:t=>.72-.18*ramp(t,8,23)}});
 const L=W.L;W.applyCam();W.update(0);gsap.set([L.brA,L.brB,L.grid,L.molecules],{opacity:1});gsap.set(L.cw,{opacity:0});
 const NS='http://www.w3.org/2000/svg',mk=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e;};
 const battery=mk('g',{class:'battery-buffer',opacity:0},W.svg);
 mk('path',{d:'M980 210 H1031 V176 M1031 110 V80 H1640 V98',fill:'none',stroke:'#A64F32','stroke-width':3},battery);
 const priorityFlow=mk('path',{d:'M1031 110 V80 H1640 V98',fill:'none',stroke:'#F4EFE4','stroke-width':2,'stroke-dasharray':'9 12'},battery);
 mk('rect',{x:1005,y:110,width:52,height:66,rx:3,fill:'#E5E2D5',stroke:'#293F3D','stroke-width':2},battery);
 const charge=mk('rect',{class:'battery-charge',x:1011,y:120,width:40,height:46,fill:'#A64F32'},battery);
 const label=mk('text',{x:1072,y:151,fill:'#293F3D','font-size':23,'font-weight':'600'},battery);label.textContent='Baterai 8 kWh';

 const tl=gsap.timeline({paused:true}),clock={t:0};
 const tStop=cue('dihentikan',1,5.6),tKeran=cue('Keran',1,7.6),tBat=cue('Baterai',1,12.9),tOp=cue('Operator',1,18.2);
 tl.fromTo(q('.reserve-ui'),{opacity:0},{opacity:1,duration:.3,ease:'none'},.25);
 tl.fromTo(q('.reserve-ui .service-intro'),{opacity:0,x:-24},{opacity:1,x:0,duration:.5,ease:'power3.out'},.28);
 // the pump stops on "dihentikan"; the badge lands on the building it describes
 tl.fromTo(q('.ro-standby-badge'),{opacity:0,y:12},{opacity:1,y:0,duration:.42,ease:'power3.out'},tStop-0.1);
 // each consequence is added to the list as it is said (accretion, nothing replaced)
 [[q('.st-tank'),tKeran],[q('.st-bat'),tBat],[q('.st-op'),tOp]].forEach(([el,at])=>tl.fromTo(el,{opacity:0,x:-16},{opacity:1,x:0,duration:.42,ease:'power3.out'},at-0.05));
 tl.fromTo(q('.tank-card'),{opacity:0,y:24},{opacity:1,y:0,duration:.5,ease:'power3.out'},cue('tangki',1,8.6)-0.1);
 tl.fromTo(battery,{opacity:0},{opacity:1,duration:.45,ease:'power2.out'},tBat-0.2);
 tl.fromTo(q('.bat-card'),{opacity:0,y:24},{opacity:1,y:0,duration:.5,ease:'power3.out'},cue('8',1,13.3)-0.1);
 tl.fromTo(q('.bat-card p'),{color:'#53645D'},{color:'#A64F32',duration:.3},cue('bukan',1,16.4));

 tl.to([q('.reserve-ui'),q('.ro-standby-badge'),battery],{opacity:0,y:-8,duration:.4,ease:'power2.in'},D-0.45);
 const update=t=>{
  const r=W.update(t),weak=ramp(t,3,8);
  if(sub)sub.update(t);
  priorityFlow.setAttribute('stroke-dashoffset',String(-t*24));
  q('.generation-meter i').style.transform=`scaleX(${r.k.toFixed(4)})`;
  L.pwB.flow.setAttribute('opacity',String((1-weak)*r.k));
  L.pwA.flow.setAttribute('opacity','0');
  L.facilityWires.setAttribute('opacity',String(.3*(1-weak)));
  L.facilityLights.forEach(e=>e.setAttribute('opacity',String(1-.88*weak)));
  L.kioskPanel.setAttribute('opacity',String(1-.85*weak));L.lampCone.setAttribute('opacity','.4');
  L.molecules.style.opacity=String(1-weak);
  const h=46*(1-.14*ramp(t,4,24));charge.setAttribute('height',String(h));charge.setAttribute('y',String(166-h));
 };
 tl.fromTo(clock,{t:0},{t:D,duration:D,ease:'none',onUpdate:()=>update(clock.t)},0);update(0);
 window.__timelines.s8=tl;
})();</script></template></body></html>
